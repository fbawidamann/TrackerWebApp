<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- App icon "Goal Ring" (chosen 2026-10-01, see docs/design/prototypes/11-app-icons.html). Source for all PNG icons. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1D2536"/><stop offset="1" stop-color="#06080C"/></linearGradient>
    <radialGradient id="sheen" cx=".22" cy=".08" r=".85"><stop offset="0" stop-color="#fff" stop-opacity=".11"/><stop offset=".6" stop-color="#fff" stop-opacity="0"/></radialGradient>
    <radialGradient id="halo" cx=".5" cy=".55" r=".5"><stop offset="0" stop-color="#4F86F7" stop-opacity=".28"/><stop offset="1" stop-color="#4F86F7" stop-opacity="0"/></radialGradient>
    <linearGradient id="arc" x1="0" y1="1" x2="1" y2="0"><stop offset="0" stop-color="#2450D4"/><stop offset=".6" stop-color="#4F86F7"/><stop offset="1" stop-color="#A9C4FF"/></linearGradient>
    <linearGradient id="db" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFFFFF"/><stop offset="1" stop-color="#A9B4C6"/></linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="2.6" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <filter id="dsh" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur in="SourceAlpha" stdDeviation="1.4"/><feOffset dy="1.6" result="o"/><feComponentTransfer><feFuncA type="linear" slope=".6"/></feComponentTransfer><feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect width="100" height="100" fill="url(#bg)"/>
  <rect width="100" height="100" fill="url(#halo)"/>
  <rect width="100" height="100" fill="url(#sheen)"/>
  <circle cx="50" cy="50" r="30" fill="none" stroke="#1A2233" stroke-width="9.5"/>
  <circle cx="50" cy="50" r="30" fill="none" stroke="url(#arc)" stroke-width="9.5" stroke-linecap="round" stroke-dasharray="152 189" transform="rotate(-90 50 50)" filter="url(#glow)"/>
  <g filter="url(#dsh)" fill="url(#db)">
    <rect x="37.5" y="48.3" width="25" height="3.4" rx="1.7"/>
    <rect x="33.5" y="40" width="5.6" height="20" rx="2.2"/>
    <rect x="60.9" y="40" width="5.6" height="20" rx="2.2"/>
    <rect x="29.6" y="43.5" width="4.2" height="13" rx="1.8"/>
    <rect x="66.2" y="43.5" width="4.2" height="13" rx="1.8"/>
  </g>
</svg>
